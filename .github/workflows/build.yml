name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        
    - name: Restore release keystore
      if: github.event_name == 'push'
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        test -n "$RELEASE_KEYSTORE_BASE64"
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        
    - name: Build debug APKs for pull requests
      if: github.event_name == 'pull_request'
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: gradle assembleDebug

    - name: Build signed release APKs
      if: github.event_name == 'push'
      env:
        ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        ACTUAL_ALIAS=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
        test -n "$ACTUAL_ALIAS"
        echo "Found Alias: $ACTUAL_ALIAS"
        export ANDROID_KEY_ALIAS="$ACTUAL_ALIAS"
        gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
        
        # Create backward-compatible copies for old auto-updater
        cp sender/build/outputs/apk/release/ADH-Notifier-Server.apk sender/build/outputs/apk/release/sender-release.apk
        cp receiver/build/outputs/apk/release/ADH-Notifier-Client.apk receiver/build/outputs/apk/release/receiver-release.apk
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          🎉 **New Auto-Release for Android Udp Notifier**
          
          📝 **อัปเดตใหม่ (Commit Message):**
          ${{ github.event.head_commit.message }}
          
          📌 **Build Number:** #${{ github.run_number }}
          🤖 อัปโหลดไฟล์ APK ล่าสุดให้ดาวน์โหลดด้านล่างนี้เลยครับ
        files: |
          sender/build/outputs/apk/release/ADH-Notifier-Server.apk
          receiver/build/outputs/apk/release/ADH-Notifier-Client.apk
          sender/build/outputs/apk/release/sender-release.apk
          receiver/build/outputs/apk/release/receiver-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Clean up old releases (Keep latest 2)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # List all releases, extract the tag (field 1)
        gh release list -L 100 | awk -F'\t' '{print $3}' > releases.txt
        
        # Start from the 3rd line (keeping the first 2) and delete them
        tail -n +3 releases.txt | while read -r version; do
          if [ -n "$version" ]; then
            echo "Deleting old release: $version"
            gh release delete "$version" --cleanup-tag -y || true
          fi
        done
