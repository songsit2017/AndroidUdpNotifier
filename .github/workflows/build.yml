name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        
    - name: Build Debug APKs
      run: gradle assembleDebug
      
    - name: Upload Sender APK
      uses: actions/upload-artifact@v4
      with:
        name: Sender-App-APK
        path: sender/build/outputs/apk/**/*.apk
        
    - name: Upload Receiver APK
      uses: actions/upload-artifact@v4
      with:
        name: Receiver-App-APK
        path: receiver/build/outputs/apk/**/*.apk
