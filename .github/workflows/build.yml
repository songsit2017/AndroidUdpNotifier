name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        
    - name: Build Debug APKs
      run: gradle assembleDebug
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          🎉 **New Auto-Release for Android Udp Notifier**
          
          📝 **อัปเดตใหม่ (Commit Message):**
          ${{ github.event.head_commit.message }}
          
          📌 **Build Number:** #${{ github.run_number }}
          🤖 อัปโหลดไฟล์ APK ล่าสุดให้ดาวน์โหลดด้านล่างนี้เลยครับ
        files: |
          sender/build/outputs/apk/debug/sender-debug.apk
          receiver/build/outputs/apk/debug/receiver-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Clean up old releases (Keep latest 2)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # List all releases, extract the tag (field 1)
        gh release list -L 100 | awk -F'\t' '{print $1}' > releases.txt
        
        # Start from the 3rd line (keeping the first 2) and delete them
        tail -n +3 releases.txt | while read -r version; do
          if [ -n "$version" ]; then
            echo "Deleting old release: $version"
            gh release delete "$version" --cleanup-tag -y || true
          fi
        done
